<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIGANTI Escribanía</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#F9F6F1;--dark:#0E1A2B;--gold:#C9B896;--gold-d:#8C7342;--border:#E8E2D9}
body{font-family:Inter,sans-serif;background:var(--bg);margin:0}
.header-principal{position:fixed;top:0;left:0;right:0;z-index:1000;height:88px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;background:rgba(249,246,241,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(14,26,43,.08)}
.logo img{height:72px}.nav-principal{display:flex;gap:26px;align-items:center}
.nav-principal a{font-size:11px;letter-spacing:2px;text-decoration:none;color:var(--dark);opacity:.7}
.lang-switch{margin-left:18px;border-left:1px solid rgba(14,26,43,.15);padding-left:18px;display:flex;gap:8px;font-size:11px}.active{font-weight:700}.inactive{opacity:.35;cursor:pointer}

/* === BARRA CORREGIDA - ESTA SI FUNCIONA === */
.barra-flotante-contacto{
  position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:9999;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  width:62px;padding:12px 8px 10px 8px;
  background: rgba(255,252,240,0.24)!important;
  backdrop-filter: blur(10px) saturate(170%)!important;
  -webkit-backdrop-filter: blur(10px) saturate(170%)!important;
  border:1px solid rgba(201,184,150,0.52)!important;
  border-radius:32px!important;
  box-shadow: 0 18px 50px rgba(14,26,43,.13)!important;
  overflow:hidden;
}
.barra-flotante-contacto::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:
    linear-gradient(102deg, transparent 12%, rgba(201,184,150,0.55) 14%, rgba(201,184,150,0.22) 15%, transparent 16%),
    linear-gradient(98deg, transparent 38%, rgba(140,115,66,0.48) 40%, rgba(201,184,150,0.32) 41%, transparent 43%),
    linear-gradient(108deg, transparent 62%, rgba(201,184,150,0.40) 64%, transparent 66%),
    radial-gradient(ellipse 140px 90px at 30% 20%, rgba(201,184,150,0.35) 0%, transparent 70%),
    radial-gradient(ellipse 120px 110px at 70% 75%, rgba(140,115,66,0.24) 0%, transparent 65%);
  filter: blur(0.4px);
  pointer-events:none;z-index:0;
  mix-blend-mode: multiply;
}
.barra-flotante-contacto a.item-flotante{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:5;text-decoration:none;transition: all.25s ease;
  color: var(--dark);
}
.barra-flotante-contacto a.item-flotante.item-dorado{background:var(--dark);color:var(--gold);border-radius:50%;margin-top:6px}

/* LACRE ROJO - SELECTOR CORRECTO AHORA */
#pin-lacre i{
  color:#a8232a!important;
  font-size:20px!important;
  filter: drop-shadow(0 2px 4px rgba(168,35,42,.35))!important;
  transition: transform.35s cubic-bezier(.34,1.56,.64,1), color.25s ease, filter.25s ease!important;
}
#pin-lacre:hover i{
  color:#ff2e3d!important;
  transform: scale(1.32) translateY(-3px)!important;
  filter: drop-shadow(0 8px 14px rgba(168,35,42,.55))!important;
}
</style>
</head>
<body>
<header class="header-principal">
<a class="logo"><img src="logo-pluma-riganti-blanco-final.png"></a>
<nav class="nav-principal">
<a href="#servicios" data-i18n="nav_serv">SERVICIOS</a>
<a href="#estudio" data-i18n="nav_est">ESTUDIO</a>
<a href="#contacto" data-i18n="nav_cont">CONTACTO</a>
<a href="#portal-login" data-i18n="nav_clientes"><i class="fa-solid fa-lock"></i> CLIENTES</a>
<div class="lang-switch"><span id="btn-es" class="active" onclick="setLang('es')">ES</span><span>|</span><span id="btn-en" class="inactive" onclick="setLang('en')">EN</span></div>
</nav>
</header>

<div class="barra-flotante-contacto">
  <a id="pin-lacre" href="https://www.google.com/maps/place/Escriban%C3%ADa+Riganti/@-34.6024583,-58.3792124,682m" target="_blank" class="item-flotante"><i class="fa-solid fa-location-dot"></i></a>
  <a href="mailto:info@riganti.com.ar" class="item-flotante"><i class="fa-regular fa-envelope"></i></a>
  <a href="tel:+541143220174" class="item-flotante"><i class="fa-solid fa-phone"></i></a>
  <a href="#contacto" class="item-flotante item-dorado">→</a>
</div>

<script>
const T={
es:{nav_serv:"SERVICIOS",nav_est:"ESTUDIO",nav_cont:"CONTACTO",nav_clientes:'<i class="fa-solid fa-lock"></i> CLIENTES'},
en:{nav_serv:"SERVICES",nav_est:"ABOUT",nav_cont:"CONTACT",nav_clientes:'<i class="fa-solid fa-lock"></i> CLIENTS'}
};
function setLang(l){
  localStorage.setItem('riganti_lang',l);
  document.getElementById('btn-es').className=l==='es'?'active':'inactive';
  document.getElementById('btn-en').className=l==='en'?'active':'inactive';
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(T[l][k])el.innerHTML=T[l][k]});
}
setLang(localStorage.getItem('riganti_lang')||'es');
</script>
</body>
</html>
