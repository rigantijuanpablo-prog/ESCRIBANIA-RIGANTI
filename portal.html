<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Exclusivo Clientes | RIGANTI Escribanía</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link href="https://googleapis.com" rel="stylesheet">
<link rel="stylesheet" href="https://cloudflare.com">

<style>
  /* ==========================================================================
     PORTAL DE ACCESO PRIVADO - ESTILO ALTA COSTURA DIGITAL
     ========================================================================== */
  
  :root {
    --bg-portal: #FAF9F6;      /* Un off-white texturado, cálido y elegante */
    --text-main: #0E1A2B;      /* Tu azul noche institucional */
    --gold: #C9B896;           /* El tono oro corporativo */
    --gold-dark: #8C7342;
    --border-line: rgba(14, 26, 43, 0.12);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-portal);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  /* Contenedor minimalista etéreo */
  .portal-wrapper {
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeInPortal 1s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Logotipo principal en el centro geométrico alto */
  .portal-logo {
    height: 76px;
    width: auto;
    object-fit: contain;
    margin-bottom: 40px;
    mix-blend-mode: multiply;
  }

  /* Encabezado editorial sofisticado */
  .portal-header {
    margin-bottom: 48px;
  }

  .portal-header h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 32px;
    font-weight: 300;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--text-main);
    margin-bottom: 12px;
  }

  .portal-header h1 i {
    font-style: italic;
    color: var(--gold-dark);
  }

  .portal-header p {
    font-size: 13px;
    color: rgba(14, 26, 43, 0.55);
    letter-spacing: 0.05em;
    line-height: 1.5;
  }

  /* Formulario estilo papelería fina (Líneas puras, sin cajas rígidas) */
  .portal-form {
    display: flex;
    flex-direction: column;
    gap: 32px;
    text-align: left;
  }

  .form-group-privado {
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .form-group-privado label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold-dark);
    font-weight: 500;
    margin-bottom: 6px;
  }

  .form-group-privado input {
    background: transparent !important;
    border: none !important;
    border-bottom: 1px solid var(--border-line) !important;
    border-radius: 0 !important;
    padding: 10px 0 !important;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--text-main);
    outline: none;
    width: 100%;
    transition: border-bottom-color 0.4s ease;
  }

  .form-group-privado input:focus {
    border-bottom-color: var(--text-main) !important; /* La línea se oscurece con finura al tipear */
  }

  /* Ícono sutil de visibilidad para la contraseña */
  .toggle-password {
    position: absolute;
    right: 0;
    bottom: 12px;
    font-size: 14px;
    color: rgba(14, 26, 43, 0.4);
    cursor: pointer;
    transition: color 0.3s ease;
  }
  
  .toggle-password:hover {
    color: var(--text-main);
  }

  /* Enlaces de asistencia discretos */
  .portal-asistencia {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: -12px;
    font-size: 12px;
  }

  .portal-link-secundario {
    color: rgba(14, 26, 43, 0.5);
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .portal-link-secundario:hover {
    color: var(--text-main);
  }

  /* Botón de ingreso sólido - Geometría pura y peso corporativo */
  .btn-ingreso-privado {
    margin-top: 16px;
    background-color: var(--text-main);
    color: #FFFFFF;
    border: 1px solid var(--text-main);
    padding: 18px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .btn-ingreso-privado:hover {
    background-color: transparent;
    color: var(--text-main);
    letter-spacing: 3.5px; /* Micro-expansión líquida muy sofisticada */
  }

  /* Pie de página con sello legal de resguardo */
  .portal-footer {
    margin-top: 64px;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(14, 26, 43, 0.35);
    text-transform: uppercase;
  }

  .portal-footer i {
    margin-right: 4px;
  }

  /* Animación orgánica de revelado inicial */
  @keyframes fadeInPortal {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Optimización para teléfonos móviles */
  @media (max-width: 480px) {
    body { padding: 16px; background-color: #FFFFFF; } /* En móvil se vuelve blanco puro para limpieza total */
    .portal-header h1 { font-size: 28px; }
    .btn-ingreso-privado { padding: 20px; }
  }
</style>
</head>
<body>

  <div class="portal-wrapper">
    
    <!-- Sello del Rombo e Isologo Dorado -->
    <img src="logo.png" alt="RIGANTI Escribanía" class="portal-logo">
    
    <!-- Encabezado de la Plataforma -->
    <div class="portal-header">
      <h1>Portal de <i>Clientes</i></h1>
      <p>Entorno cifrado de seguridad jurídica confidencial</p>
    </div>

    <!-- Formulario de Credenciales -->
    <form class="portal-form" action="#" method="POST">
      
      <!-- Campo Usuario / ID -->
      <div class="form-group-privado">
        <label for="username">Identificación / Usuario</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="ej. apellido@empresa.com">
      </div>

      <!-- Campo Contraseña Privada -->
      <div class="form-group-privado">
        <label for="password">Clave de Acceso</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
      </div>

      <!-- Enlaces de Asistencia de Credenciales -->
      <div class="portal-asistencia">
        <a href="#" class="portal-link-secundario">¿Olvidó su contraseña?</a>
        <a href="index.html" class="portal-link-secundario"><i class="fa-solid fa-arrow-left" style="font-size: 9px; margin-right: 4px;"></i> Volver al sitio</a>
      </div>

      <!-- Botón de Envío Geométrico -->
      <button type="submit" class="btn-ingreso-privado">
        Ingresar de forma segura <i class="fa-solid fa-shield-halved" style="font-size: 10px; margin-left: 2px;"></i>
      </button>

    </form>

    <!-- Sello de Privacidad de Cierre -->
    <div class="portal-footer">
      <i class="fa-solid fa-lock"></i> Conexión encriptada SSL de un extremo a otro
    </div>

  </div>

  <!-- SCRIPT PARA INTERACCIÓN SOPHISTICATED DE CONTRASEÑA -->
  <script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.querySelector('.toggle-password');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }
  </script>

</body>
</html>
