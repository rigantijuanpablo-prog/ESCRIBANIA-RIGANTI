<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Exclusivo Clientes | RIGANTI Escribanía</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg-portal:#FAF9F6;--text-main:#0E1A2B;--gold-dark:#8C7342;--border-line:rgba(14,26,43,0.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg-portal);color:var(--text-main);min-height:100vh;display:flex;overflow-x:hidden}
 .portal-container{display:flex;width:100vw;min-height:100vh}

  /* FIX ARCO: ahora es una IMG real, no background, así no recorta nunca */
 .portal-visual-side{flex:1;position:relative;overflow:hidden;background:#EDE9E3}
 .portal-visual-side img{
    width:100%;height:100%;object-fit:cover;
    /* ESTA ES LA CLAVE DEL BOCETO: mostramos arco arriba y sillas abajo */
    object-position: 32% 28%;
    display:block;
  }
 .portal-visual-side::after{
    content:"";position:absolute;inset:0;
    background: linear-gradient(135deg, rgba(14,26,43,0.08) 0%, rgba(14,26,43,0.02) 100%);
  }

 .portal-form-side{flex:1;background:var(--bg-portal);display:flex;align-items:center;justify-content:center;padding:60px;position:relative}
 .portal-wrapper{width:100%;max-width:380px;text-align:center;animation:fadeIn 0.8s cubic-bezier(0.25,1,0.5,1)}
 .portal-logo{height:72px;margin:0 auto 32px;display:block}
 .portal-header{margin-bottom:40px}
 .portal-header h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;margin-bottom:12px}
 .portal-header h1 i{font-style:italic;color:var(--gold-dark)}
 .portal-header p{font-size:13px;color:rgba(14,26,43,0.55);letter-spacing:0.05em;line-height:1.5}
 .portal-form{display:flex;flex-direction:column;gap:32px;text-align:left}
 .form-group-privado{display:flex;flex-direction:column;position:relative}
 .form-group-privado label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:500;margin-bottom:6px}
 .form-group-privado input{background:transparent!important;border:none!important;border-bottom:1px solid var(--border-line)!important;border-radius:0!important;padding:10px 0!important;font-size:15px;color:var(--text-main);outline:none;width:100%}
 .form-group-privado input:focus{border-bottom-color:var(--text-main)!important}
 .toggle-password{position:absolute;right:0;bottom:12px;font-size:14px;color:rgba(14,26,43,0.4);cursor:pointer}
 .portal-asistencia{display:flex;justify-content:space-between;align-items:center;margin-top:-12px;font-size:12px}
 .portal-link-secundario{color:rgba(14,26,43,0.5);text-decoration:none}
 .btn-ingreso-privado{margin-top:12px;background:var(--text-main);color:#FFF;border:1px solid var(--text-main);height:48px;padding:0 18px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.5s}
 .btn-ingreso-privado:hover{background:transparent;color:var(--text-main);letter-spacing:2.5px}
 .portal-footer{margin-top:56px;font-size:10px;letter-spacing:1px;color:rgba(14,26,43,0.35);text-transform:uppercase}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:900px){.portal-visual-side{display:none!important}.portal-form-side{padding:32px 24px;background:#FFF}}
</style>
</head>
<body>
  <div class="portal-container">
    <div class="portal-visual-side">
      <img src="hall-portal-riganti.jpg" alt="Sede RIGANTI Escribanía">
    </div>
    <div class="portal-form-side">
      <div class="portal-wrapper">
        <img src="logo-pluma-riganti-blanco-final.png" alt="RIGANTI" class="portal-logo">
        <div class="portal-header">
          <h1 id="t-title">Portal de <i>Clientes</i></h1>
          <p id="t-sub">Entorno cifrado de seguridad jurídica confidencial</p>
        </div>
        <form class="portal-form" action="#" method="POST">
          <div class="form-group-privado">
            <label id="t-user-label" for="username">Identificación / Usuario</label>
            <input type="text" id="username" name="username" required placeholder="ej. apellido@empresa.com">
          </div>
          <div class="form-group-privado">
            <label id="t-pass-label" for="password">Clave de Acceso</label>
            <input type="password" id="password" name="password" required>
            <i class="fa-regular fa-eye toggle-password" onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.classList.toggle('fa-eye');this.classList.toggle('fa-eye-slash')"></i>
          </div>
          <div class="portal-asistencia">
            <a href="#" class="portal-link-secundario" id="t-forgot">¿Olvidó su contraseña?</a>
            <a href="index.html" class="portal-link-secundario" id="t-back"><i class="fa-solid fa-arrow-left" style="font-size:9px;margin-right:4px;"></i> Volver</a>
          </div>
          <button type="submit" class="btn-ingreso-privado">
            <span id="t-btn">Ingresar de forma segura</span> <i class="fa-solid fa-shield-halved" style="font-size:10px"></i>
          </button>
        </form>
        <div class="portal-footer" id="t-footer">
          <i class="fa-solid fa-lock"></i> Conexión encriptada SSL de un extremo a otro
        </div>
      </div>
    </div>
  </div>

<script>
  // --- FIX IDIOMA HEREDADO DEL INDEX ---
  const dict = {
    es: {
      title: 'Portal de <i>Clientes</i>',
      sub: 'Entorno cifrado de seguridad jurídica confidencial',
      user: 'Identificación / Usuario',
      pass: 'Clave de Acceso',
      forgot: '¿Olvidó su contraseña?',
      back: 'Volver',
      btn: 'Ingresar de forma segura',
      footer: 'Conexión encriptada SSL de un extremo a otro',
      place: 'ej. apellido@empresa.com'
    },
    en: {
      title: 'Client <i>Portal</i>',
      sub: 'Encrypted environment of confidential legal security',
      user: 'Identification / User',
      pass: 'Access Key',
      forgot: 'Forgot your password?',
      back: 'Back',
      btn: 'Secure Login',
      footer: 'End-to-end SSL encrypted connection',
      place: 'e.g. surname@company.com'
    }
  };

  function getLang() {
    const urlLang = new URLSearchParams(window.location.search).get('lang');
    if (urlLang) return urlLang;
    return localStorage.getItem('riganti_lang') || 'es';
  }

  const lang = getLang() === 'en'? 'en' : 'es';
  document.documentElement.lang = lang;
  const t = dict[lang];
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('t-sub').innerText = t.sub;
  document.getElementById('t-user-label').innerText = t.user;
  document.getElementById('t-pass-label').innerText = t.pass;
  document.getElementById('t-forgot').innerText = t.forgot;
  document.getElementById('t-back').innerHTML = `<i class="fa-solid fa-arrow-left" style="font-size:9px;margin-right:4px;"></i> ${t.back}`;
  document.getElementById('t-btn').innerText = t.btn;
  document.getElementById('t-footer').innerHTML = `<i class="fa-solid fa-lock"></i> ${t.footer}`;
  document.getElementById('username').placeholder = t.place;

  // Hace que el Volver respete el idioma
  document.getElementById('t-back').href = lang === 'en'? 'index.html?lang=en' : 'index.html';
</script>
</body>
</html>
